<section
  class="page-hero mesh-bg"
  [class.page-hero--featured]="variant() === 'featured'"
  [class.page-hero--compact]="variant() === 'compact'"
>
  <div
    class="page-hero__inner relative z-10"
    [class.page-hero__inner--split]="layout() === 'split'"
  >
    <ng-content select="[pageHeroLeading]" />

    <div class="page-hero__main min-w-0">
      <div class="page-hero__text min-w-0">
        @if (eyebrow() && variant() === 'featured') {
          <p class="page-hero__eyebrow text-sm font-medium uppercase tracking-widest text-accent-muted/80">
            {{ eyebrow() }}
          </p>
        }

        <h1 class="page-hero__title font-display font-bold text-white">
          {{ title() }}
        </h1>

        @if (description()) {
          <p class="page-hero__description text-flow-200/90">
            {{ description() }}
          </p>
        }

        <ng-content select="[pageHeroDescription]" />
      </div>

      <div class="page-hero__meta">
        <ng-content select="[pageHeroBadge]" />
      </div>
    </div>
  </div>

  <div class="page-hero__glow pointer-events-none absolute -right-8 -top-8 rounded-full bg-accent/20 blur-3xl" aria-hidden="true"></div>
</section>
