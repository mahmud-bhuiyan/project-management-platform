<section class="page-hero mesh-bg px-6 py-10 sm:px-10 sm:py-12">
  <div
    class="page-hero__inner relative z-10 max-w-2xl"
    [class.page-hero__inner--split]="layout() === 'split'"
  >
    @if (layout() === 'split') {
      <ng-content select="[pageHeroLeading]" />
    }

    <div class="min-w-0">
      @if (eyebrow()) {
        <p class="text-sm font-medium uppercase tracking-widest text-accent-muted/80">
          {{ eyebrow() }}
        </p>
      }

      <h1 class="mt-2 font-display text-3xl font-bold text-white sm:text-4xl">
        {{ title() }}
      </h1>

      @if (description()) {
        <p class="mt-2 max-w-2xl text-base text-flow-200/90">
          {{ description() }}
        </p>
      }

      <ng-content select="[pageHeroDescription]" />
      <ng-content select="[pageHeroBadge]" />
    </div>
  </div>

  <div
    class="page-hero__glow pointer-events-none absolute -right-8 -top-8 h-48 w-48 rounded-full bg-accent/20 blur-3xl"
    aria-hidden="true"
  ></div>
</section>
