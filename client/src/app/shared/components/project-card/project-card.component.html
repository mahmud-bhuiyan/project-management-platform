@if (link(); as projectLink) {
  <a
    class="project-card project-card--interactive"
    [routerLink]="projectLink"
    [attr.data-testid]="'project-card-' + project().id"
  >
    <ng-container *ngTemplateOutlet="cardBody" />
  </a>
} @else {
  <article
    class="project-card"
    [attr.data-testid]="'project-card-' + project().id"
  >
    <ng-container *ngTemplateOutlet="cardBody" />
  </article>
}

<ng-template #cardBody>
  <div class="project-card__header">
    <div class="project-card__title-row">
      <h3 class="project-card__title">{{ project().name }}</h3>
      @if (editable()) {
        <button
          type="button"
          class="project-card__edit-btn"
          [attr.data-testid]="'project-edit-' + project().id"
          (click)="edit.emit()"
        >
          Edit
        </button>
      }
    </div>
    <div class="project-card__badges">
      <app-project-status-badge [status]="project().status" />
      <app-project-priority-badge [priority]="project().priority" />
    </div>
  </div>

  @if (descriptionPreview(); as description) {
    <p class="project-card__description">{{ description }}</p>
  } @else {
    <p class="project-card__description project-card__description--placeholder">
      No description yet.
    </p>
  }

  <div class="project-card__footer">
    <div class="project-card__owner">
      <span class="project-card__avatar" aria-hidden="true">{{ ownerInitials() }}</span>
      <span class="project-card__owner-name">{{ project().owner.name }}</span>
    </div>

    @if (dueDateLabel(); as dueDate) {
      <p class="project-card__due-date">
        Due {{ dueDate }}
      </p>
    }
  </div>
</ng-template>
