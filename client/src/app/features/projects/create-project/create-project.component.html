<app-page-hero title="Create project" />

@if (!activeOrganization()) {
  <section class="mt-8 glass-panel rounded-2xl p-6 sm:p-8">
    <h2 class="font-display text-lg font-bold text-flow-900">No organization selected</h2>
    <p class="mt-2 text-sm text-gray-600">
      Use the organization switcher in the sidebar to choose a workspace.
    </p>
  </section>
} @else {
  <section class="mt-8">
    <a
      routerLink="/projects"
      class="project-page-back-link"
      data-testid="project-create-back"
    >
      ← Back to projects
    </a>
  </section>

  <section class="mt-4 glass-panel rounded-2xl p-6 sm:p-8">
    <h2 class="font-display text-lg font-bold text-flow-900">Project details</h2>
    <p class="mt-1 text-sm text-gray-600">
      Set the basics now — you can refine scope and membership later.
    </p>

    <div class="mt-4 max-w-3xl">
      <app-project-form
        [form]="projectForm"
        [isSubmitting]="isSubmitting()"
        [formError]="formError()"
        submitLabel="Create project"
        submittingLabel="Creating…"
        (submitted)="submit()"
      />
    </div>
  </section>
}
