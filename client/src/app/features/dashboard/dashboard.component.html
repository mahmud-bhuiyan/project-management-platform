<app-page-hero
  [eyebrow]="heroEyebrow()"
  [title]="heroTitle()"
  description="You’re signed in and ready. Full dashboard stats, project views, and Kanban boards arrive in Phase 4."
/>

<section class="mt-8 grid gap-4 sm:grid-cols-3">
  <article class="glass-panel rounded-2xl p-5">
    <p class="text-xs font-semibold uppercase tracking-wide text-flow-500">Active projects</p>
    <div class="mt-3 h-9 w-16 stat-placeholder rounded-lg"></div>
    <p class="mt-2 text-xs text-gray-500">Phase 4</p>
  </article>
  <article class="glass-panel rounded-2xl p-5">
    <p class="text-xs font-semibold uppercase tracking-wide text-flow-500">Open tasks</p>
    <div class="mt-3 h-9 w-16 stat-placeholder rounded-lg"></div>
    <p class="mt-2 text-xs text-gray-500">Phase 6</p>
  </article>
  <article class="glass-panel rounded-2xl p-5">
    <p class="text-xs font-semibold uppercase tracking-wide text-flow-500">Team members</p>
    <div class="mt-3 h-9 w-16 stat-placeholder rounded-lg"></div>
    <p class="mt-2 text-xs text-gray-500">Phase 3</p>
  </article>
</section>

<section class="mt-8 glass-panel rounded-2xl p-6 sm:p-8">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h2 class="font-display text-lg font-bold text-flow-900">What’s next</h2>
      <p class="mt-1 text-sm text-gray-600">
        Organizations, projects, and task boards are on the roadmap.
      </p>
    </div>
    <span
      class="inline-flex w-fit items-center gap-2 rounded-full bg-flow-100 px-4 py-1.5 text-xs font-semibold text-flow-600"
    >
      <span class="h-1.5 w-1.5 rounded-full bg-accent-strong"></span>
      Building in progress
    </span>
  </div>
</section>
