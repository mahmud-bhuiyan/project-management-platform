<div
  class="notification-bell"
  [class.notification-bell--open]="isOpen()"
  data-testid="notification-bell"
>
  <button
    type="button"
    class="notification-bell__trigger"
    data-testid="notification-bell-trigger"
    [attr.aria-expanded]="isOpen()"
    aria-haspopup="true"
    aria-label="Notifications"
    (click)="toggleDropdown()"
  >
    <svg class="notification-bell__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>

    @if (unreadCount() > 0) {
      <span class="notification-bell__badge" data-testid="notification-bell-badge">
        {{ unreadBadgeLabel() }}
      </span>
    }
  </button>

  @if (isOpen()) {
    <section
      class="notification-bell__panel"
      data-testid="notification-bell-panel"
      aria-label="Notifications"
    >
      <div class="notification-bell__panel-header">
        <h2 class="notification-bell__panel-title">Notifications</h2>
        <button
          type="button"
          class="notification-bell__mark-all"
          data-testid="notification-bell-mark-all"
          [disabled]="isMarkingAll() || unreadCount() === 0"
          (click)="markAllAsRead()"
        >
          {{ isMarkingAll() ? 'Marking…' : 'Mark all read' }}
        </button>
      </div>

      @if (isLoadingList()) {
        <p class="notification-bell__status">Loading notifications…</p>
      } @else if (listError(); as error) {
        <p class="notification-bell__status notification-bell__status--error" role="alert">
          {{ error }}
        </p>
      } @else if (notifications().length === 0) {
        <p class="notification-bell__status">You're all caught up.</p>
      } @else {
        <ul class="notification-bell__list">
          @for (notification of notifications(); track notification.id) {
            <li>
              <button
                type="button"
                class="notification-bell__item"
                [class.notification-bell__item--unread]="isUnread(notification)"
                [attr.data-testid]="'notification-item-' + notification.id"
                [disabled]="markingReadId() === notification.id"
                (click)="openNotification(notification)"
              >
                <span class="notification-bell__item-title">{{ notification.title }}</span>
                <span class="notification-bell__item-body">{{ notification.body }}</span>
                <span class="notification-bell__item-time">
                  {{ formatTimestamp(notification.createdAt) }}
                </span>
              </button>
            </li>
          }
        </ul>
      }
    </section>
  }
</div>
