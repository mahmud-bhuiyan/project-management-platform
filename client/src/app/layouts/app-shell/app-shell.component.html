<div class="app-shell">
  @if (mobileNavOpen()) {
    <button
      type="button"
      class="app-shell__backdrop"
      aria-label="Close navigation menu"
      (click)="closeMobileNav()"
    ></button>
  }

  <aside
    class="app-shell__sidebar"
    [class.app-shell__sidebar--open]="mobileNavOpen()"
    aria-label="Sidebar"
  >
    <div class="app-shell__brand">
      <div class="app-shell__logo">F</div>
      <span class="app-shell__brand-name">Flowdesk</span>
      <button
        type="button"
        class="app-shell__close-nav"
        aria-label="Close navigation menu"
        (click)="closeMobileNav()"
      >
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <nav class="app-shell__nav" aria-label="Main navigation">
      <a
        routerLink="/dashboard"
        routerLinkActive="nav-link-active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
        (click)="closeMobileNav()"
      >
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" />
        </svg>
        Dashboard
      </a>

      <a
        routerLink="/profile"
        routerLinkActive="nav-link-active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
        (click)="closeMobileNav()"
      >
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
        </svg>
        Profile
      </a>

      @if (isSuperadmin()) {
        <a
          routerLink="/admin/company-admins"
          routerLinkActive="nav-link-active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link"
          (click)="closeMobileNav()"
        >
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M18 18.72a9.094 9.094 0 003.741-.479 3 3 0 00-4.682-2.72m.94 3.198l.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0112 21c-2.17 0-4.207-.576-5.963-1.584A6.062 6.062 0 016 18.719m12 0a5.971 5.971 0 00-.941-3.197m0 0A5.995 5.995 0 0012 12.75a5.995 5.995 0 00-5.058 2.772m0 0a3 3 0 00-4.681 2.72 8.986 8.986 0 003.74.477m.94-3.197a5.971 5.971 0 00-.94 3.197M15 6.75a3 3 0 11-6 0 3 3 0 016 0zm6 3a2.25 2.25 0 11-4.5 0 2.25 2.25 0 014.5 0zm-13.5 0a2.25 2.25 0 11-4.5 0 2.25 2.25 0 014.5 0z" />
          </svg>
          Provision company
        </a>
      }

      <span class="nav-link nav-link--disabled">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.75V12A2.25 2.25 0 014.5 9.75h15A2.25 2.25 0 0121.75 12v.75m-8.69-6.44l.12-.07a.75.75 0 011.02.06l3.5 3.25a.75.75 0 01-.06 1.06l-3.25 2.5a.75.75 0 01-1.06-.06l-.12-.07M12 18.75h8.25" />
        </svg>
        Projects
        <span class="nav-badge">Soon</span>
      </span>

      <span class="nav-link nav-link--disabled">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-4.772 4.22L7.5 9.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25h6.75a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25h-1.5" />
        </svg>
        Tasks
        <span class="nav-badge">Soon</span>
      </span>
    </nav>

    <div class="app-shell__user">
      <a
        routerLink="/profile"
        class="app-shell__user-card"
        (click)="closeMobileNav()"
      >
        <div class="app-shell__avatar">{{ userInitials() }}</div>
        <div class="min-w-0 flex-1">
          <p class="truncate text-sm font-medium text-flow-900">{{ user()?.name ?? 'User' }}</p>
          <p class="truncate text-xs text-gray-500">{{ user()?.email }}</p>
        </div>
      </a>
    </div>
  </aside>

  <div class="app-shell__main">
    <header class="app-shell__header">
      <div class="app-shell__header-start">
        <button
          type="button"
          class="app-shell__menu-btn"
          aria-label="Open navigation menu"
          [attr.aria-expanded]="mobileNavOpen()"
          (click)="toggleMobileNav()"
        >
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
          </svg>
        </button>

        <p class="app-shell__date app-shell__date--full">
          {{ todayLabel() }}
        </p>
        <p class="app-shell__date app-shell__date--short">
          {{ todayLabelShort() }}
        </p>
      </div>

      <button
        type="button"
        class="app-shell__sign-out"
        (click)="signOut()"
        [disabled]="isSigningOut()"
      >
        {{ isSigningOut() ? 'Signing out…' : 'Sign out' }}
      </button>
    </header>

    <main class="app-shell__content">
      <router-outlet />
    </main>
  </div>
</div>
